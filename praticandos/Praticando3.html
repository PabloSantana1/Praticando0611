<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando 3 - Formulário com validações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-3">
        <h1>Praticando 3 - Formulário com validações</h1>

        <div class="col-lg-8">
            <form id="formulario" novalidate>
                <div class="row">
                    <div class="col-md-6">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control is-invalid" id="nome">
                        <div class="invalid-feedback">Informe seu nome completo</div>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="text" class="form-control is-invalid" id="email" placeholder="seu@email.aqui">
                        <div class="invalid-feedback">Informe um endereço de email válido</div>
                    </div>
                </div>

                <div class="row mt-2">
                    <div class="col-md-6">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="text" class="form-control is-invalid" id="telefone">
                        <div class="invalid-feedback">Informe um telefone de contato</div>
                    </div>

                    <div class="col-md-6">
                        <label for="idade" class="form-label">Idade</label>
                        <select class="form-select is-invalid" id="idade">
                            <option value="" selected>[Escolha uma opção]</option>
                            <option value="ate18">Até 18 anos</option>
                            <option value="19a25">19 a 25 anos</option>
                            <option value="26a40">26 a 40 anos</option>
                            <option value="41a60">41 a 60 anos</option>
                            <option value="60mais">Mais de 60 anos</option>
                        </select>
                        <div class="invalid-feedback">Escolha a opção que representa sua idade atual</div>
                    </div>
                </div>

                <div class="row mt-2">
                    <div class="col-12">
                        <label for="observacoes" class="form-label">Observações</label>
                        <textarea class="form-control is-invalid" id="observacoes" rows="2"></textarea>
                    </div>
                </div>

                <div class="mt-3" style="padding-left: 217px;">
                    <button type="submit" class="btn btn-primary">Enviar</button>
                    <button type="reset" class="btn btn-warning">Limpar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const formulario = document.getElementById("formulario");
        const campos = formulario.querySelectorAll("input, select, textarea");

        // Um campo é válido quando tem algum valor (não vazio)
        function validar(campo) {
            if (campo.value.trim() !== "") {
                campo.classList.remove("is-invalid");
                campo.classList.add("is-valid");
            } else {
                campo.classList.remove("is-valid");
                campo.classList.add("is-invalid");
            }
        }

        // Valida conforme o usuário preenche (input: digitação / change: select)
        campos.forEach(function (campo) {
            campo.addEventListener("input", function () { validar(campo); });
            campo.addEventListener("change", function () { validar(campo); });
        });

        // Limpar: volta tudo ao estado inicial (todos os campos incorretos / em vermelho)
        formulario.addEventListener("reset", function () {
            // o reset nativo só zera os valores depois do evento, então esperamos ele terminar
            setTimeout(function () {
                campos.forEach(validar);
            }, 0);
        });

        formulario.addEventListener("submit", function (evento) {
            evento.preventDefault();
            campos.forEach(validar);
            if (formulario.querySelectorAll(".is-invalid").length === 0) {
                alert("Formulário enviado com sucesso!");
            }
        });
    </script>
</body>

</html>
