<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando 1 - Mostrar/Esconder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-3">
        <h1>Praticando 1 - Mostrar/Esconder</h1>

        <div class="d-flex justify-content-between mb-3">
            <button type="button" class="btn btn-primary" id="btnMostrar">Mostrar</button>
            <button type="button" class="btn btn-primary" id="btnEsconder">Esconder</button>
        </div>

        <div id="meuDiv" class="bg-primary-subtle text-center py-4">
            <span class="display-1 fw-light">Meu DIV</span>
        </div>
    </div>

    <script>
        const meuDiv = document.getElementById("meuDiv");

        // d-none é a classe do Bootstrap que aplica display: none
        document.getElementById("btnMostrar").addEventListener("click", function () {
            meuDiv.classList.remove("d-none");
        });

        document.getElementById("btnEsconder").addEventListener("click", function () {
            meuDiv.classList.add("d-none");
        });
    </script>
</body>

</html>
