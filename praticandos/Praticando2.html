<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando 2 - Lâmpada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<!-- A página começa "apagada": texto branco e fundo preto -->
<body class="bg-black text-white min-vh-100">
    <div class="container text-center pt-2">
        <h1 class="text-start">Praticando 2 - Lâmpada</h1>

        <img id="lampada" src="img/lampada.png" alt="Lâmpada" height="390">

        <h4 id="legenda" class="fw-bold mt-4">Lâmpada apagada</h4>
    </div>

    <script>
        const lampada = document.getElementById("lampada");
        const legenda = document.getElementById("legenda");

        // Mouse sobre a lâmpada: "acende" (texto preto, fundo branco, imagem acesa)
        lampada.addEventListener("mouseover", function () {
            document.body.classList.replace("bg-black", "bg-white");
            document.body.classList.replace("text-white", "text-black");
            lampada.src = "img/lampada-acesa.png";
            legenda.textContent = "Lâmpada acesa";
        });

        // Mouse sai da lâmpada: "apaga" de novo
        lampada.addEventListener("mouseout", function () {
            document.body.classList.replace("bg-white", "bg-black");
            document.body.classList.replace("text-black", "text-white");
            lampada.src = "img/lampada.png";
            legenda.textContent = "Lâmpada apagada";
        });
    </script>
</body>

</html>
